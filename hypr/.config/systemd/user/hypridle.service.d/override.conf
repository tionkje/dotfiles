[Unit]
# Disable the start-rate-limit so a flaky hypridle keeps retrying indefinitely
# (hypridle 0.1.7-9 + sdbus-cpp 2.3.0-1 currently segfaults on dbus signal
# registration; supervision should survive that until upstream is fixed).
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10s
# Verbose logging — every listener fire/reset prints to the journal.
ExecStart=
ExecStart=/usr/bin/hypridle -v
